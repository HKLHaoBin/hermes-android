name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: Hermes 运行时渠道（locked = 使用 runtime.lock 中固定的版本）
        type: choice
        options: [locked, stable, canary]
        default: locked
      version:
        description: 固定运行时版本（Debian 版本号，留空取该渠道最新）
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  CHANNEL_INPUT: ${{ inputs.channel || 'locked' }}
  VERSION_INPUT: ${{ inputs.version || '' }}

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Runtime package lock regressions
        run: python3 scripts/test_fetch_payload.py

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android/sdk/ndk || true
          df -h /

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: File chooser MIME policy regressions
        run: |
          mkdir -p build/native-policy
          javac --release 17 -Xlint:all -d build/native-policy android/app/src/main/java/io/github/hermesandroid/FileChooserMimeTypes.java android/native-tests/FileChooserMimeTypesTest.java
          java -cp build/native-policy io.github.hermesandroid.FileChooserMimeTypesTest

      - name: Job ledger contract regressions
        run: python3 scripts/test_job_ledger_contract.py

      - name: Job ledger source contract regressions
        run: python3 scripts/test_job_ledger_source.py

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      - name: Download the official Hermes Android runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gpgv gnupg binutils dpkg patchelf >/dev/null
          EXTRA=()
          if [ "$CHANNEL_INPUT" = locked ]; then
            . ./runtime.lock
            CHANNEL="$HERMES_RUNTIME_CHANNEL"; VERSION="${VERSION_INPUT:-$HERMES_RUNTIME_VERSION}"
            EXTRA=(--package-lock runtime-package.lock.json)
          else
            CHANNEL="$CHANNEL_INPUT"; VERSION="$VERSION_INPUT"
          fi
          echo "runtime: channel=$CHANNEL version=${VERSION:-latest}"
          scripts/ci_run.sh fetch python3 scripts/fetch_payload.py --channel "$CHANNEL" --version "$VERSION" "${EXTRA[@]}" --out build/deb
          cat build/deb/meta.json

      - name: Inspect runtime layout
        run: |
          ROOT=build/deb/root/data/data/com.termux/files/usr/lib/hermes-agent
          du -sh "$ROOT"/* || true
          find "$ROOT" -maxdepth 2 | sort | head -60
          cat "$ROOT/bin/hermes" || true
          cat "$ROOT/app/install-stamp.json" || true
          {
            echo "deb: $(cat build/deb/meta.json | tr -d '\n')"
            du -sh "$ROOT"/* "$ROOT"/tools/* 2>/dev/null
            echo "--- tools depth 5"
            find "$ROOT/tools" -maxdepth 7 -type d | sed "s|$ROOT/||" | head -40
            echo "--- bin/hermes"
            grep -E '^(PYTHON|REPO|SITE)=' "$ROOT/bin/hermes" || true
          } > build/layout.txt
          echo "::notice title=runtime layout::$(sed 's/%/%25/g' build/layout.txt | awk '{printf "%s%%0A", $0}')"

      - name: Resolve upstream source revision
        id: upstream
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          stamp = pathlib.Path("build/deb/root/data/data/com.termux/files/usr/lib/hermes-agent/app/install-stamp.json")
          data = json.loads(stamp.read_text()) if stamp.is_file() else {}
          meta = json.loads(pathlib.Path("build/deb/meta.json").read_text())
          print(f"commit={data.get('commit') or ''}")
          print(f"version={data.get('display_version') or data.get('base_version') or meta['version']}")
          print(f"deb_version={meta['version']}")
          PY

      - name: Check out pinned public Hermes WebUI
        uses: actions/checkout@v5
        with:
          repository: nesquena/hermes-webui
          ref: 21426ee7ffcd620f5e9d53401ee21c4c6dbb9c9d
          path: webui-source
          persist-credentials: false


      - name: Stage WebUI source allowlist
        run: |
          mkdir -p build/webui
          git -C webui-source archive HEAD LICENSE server.py api static mcp_server.py managed_agent_startup.py bootstrap.py scripts | tar -x -C build/webui
          test -f build/webui/static/index.html
          python3 scripts/stage_android_terminal.py build/webui
          git -C webui-source rev-parse HEAD > build/webui/ANDROID_WEBUI_REVISION

      - name: Android import frontend regressions with pinned API helper
        run: HERMES_WEBUI_SOURCE=build/webui node --test scripts/test_android_import.js scripts/test_android_import_chat.js

      - name: Relocate runtime for the app
        run: |
          scripts/ci_run.sh relocate python3 scripts/relocate_payload.py \
            --deb-root build/deb/root \
            --webui build/webui \
            --meta build/deb/meta.json \
            --runpath \
            --out build/payload
          mkdir -p android/app/src/main/assets/payload
          cp build/payload/payload.zip build/payload/payload.json android/app/src/main/assets/payload/
          python3 -c "import json;m=json.load(open('build/payload/payload.json'));print(json.dumps({k:m[k] for k in ('payload_id','launcher','ld_library_path','path','node','cert_file','missing_libs','runpath','file_count','total_bytes','zip_bytes')},indent=1,ensure_ascii=False))" > build/payload-summary.txt
          echo "::notice title=payload::$(sed 's/%/%25/g' build/payload-summary.txt | awk '{printf "%s%%0A", $0}')"

      - name: Build APK with the persistent release key
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          HERMES_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HERMES_ANDROID_VERSION_CODE: ${{ github.run_number }}
          HERMES_ANDROID_VERSION_NAME: '0.1.2'
        run: |
          if [[ -z "$KEYSTORE_B64" || -z "$HERMES_ANDROID_KEYSTORE_PASSWORD" ]]; then
            echo '::error::Persistent release signing secrets are required. No debug fallback.'
            exit 1
          fi
          umask 077
          export HERMES_ANDROID_KEYSTORE="$(mktemp "$RUNNER_TEMP/hermes-signing.XXXXXXXX.p12")"
          trap 'rm -f -- "$HERMES_ANDROID_KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$HERMES_ANDROID_KEYSTORE"
          unset KEYSTORE_B64
          export HERMES_ANDROID_KEY_ALIAS=hermes-android
          export HERMES_ANDROID_KEY_PASSWORD="$HERMES_ANDROID_KEYSTORE_PASSWORD"
          ../scripts/ci_run.sh gradle gradle assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature (v1 + v2 + v3)
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs --min-sdk-version 21 "$APK" > build/apksigner.txt 2>&1 || { cat build/apksigner.txt; exit 1; }
          grep -qi "v1 scheme (JAR signing): true" build/apksigner.txt
          grep -qi "v2 scheme (APK Signature Scheme v2): true" build/apksigner.txt
          grep -qi "v3 scheme (APK Signature Scheme v3): true" build/apksigner.txt
          expected=$(tr -d '\r\n' < android/release-cert.sha256)
          actual=$(awk '/^(Signer #[0-9]+ certificate|V[0-9.]+ Signer: certificate) SHA-256 digest:/ {print tolower($NF)}' build/apksigner.txt | sort -u)
          grep -qx 'Number of signers: 1' build/apksigner.txt
          grep -Ei 'Signer|Number of signers' build/apksigner.txt
          [[ "$expected" =~ ^[0-9a-f]{64}$ && "$actual" = "$expected" ]] || { echo '::error::Unexpected release signer'; exit 1; }
          printf 'Verified release certificate SHA-256: %s\n' "$actual"

      - name: Collect APK
        id: apk
        run: |
          mkdir -p dist
          NAME="hermes-android-${{ steps.upstream.outputs.version }}-${{ github.run_number }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "dist/$NAME"
          cp build/payload/payload.json dist/payload.json
          cp android/release-cert.sha256 dist/release-cert.sha256
          (cd dist && sha256sum "$NAME" > "$NAME.sha256")
          ls -lh dist
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v5
        with:
          name: payload
          path: build/payload/
          compression-level: 0
          retention-days: 3

      - uses: actions/upload-artifact@v5
        with:
          name: apk
          path: dist/
          compression-level: 0

    outputs:
      name: ${{ steps.apk.outputs.name }}
      version: ${{ steps.upstream.outputs.version }}
      deb_version: ${{ steps.upstream.outputs.deb_version }}
      commit: ${{ steps.upstream.outputs.commit }}

  smoke:
    name: Smoke test in an Android container
    needs: apk
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      IMAGE: termux/termux-docker:aarch64
      FINAL: /data/data/com.termux/files/home/sim
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: payload
          path: build/payload

      - name: Install the payload the way the app does
        run: |
          python3 scripts/install_payload.py --zip build/payload/payload.zip --manifest build/payload/payload.json \
            --dest sim/files/hermes-agent --final-root "$FINAL/files/hermes-agent"
          python3 scripts/smoke_env.py --manifest build/payload/payload.json \
            --root "$FINAL/files/hermes-agent" --files "$FINAL/files" --out sim/files/run.sh
          cp scripts/smoke_webui.py scripts/smoke_runtime_fixes.py scripts/smoke.sh sim/
          chmod -R a+rwX sim
          cat sim/files/run.sh

      - name: Probe the container
        run: |
          docker pull -q "$IMAGE"
          docker run --rm --entrypoint /system/bin/sh "$IMAGE" -c 'id; uname -a; ls -ld /system /system/bin; ls -l /system/bin/sh; ls /data/data/com.termux/files/usr' > probe.txt 2>&1 || true
          echo "::notice title=container::$(head -c 3000 probe.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"

      - name: Run Hermes with the Termux prefix hidden
        run: |
          T=/data/data/com.termux/files/usr
          scripts/ci_run.sh smoke docker run --rm --user 1000:1000 \
            --tmpfs $T/lib:mode=0755,uid=1000,gid=1000 --tmpfs $T/etc:mode=0755,uid=1000,gid=1000 \
            --tmpfs $T/share:mode=0755,uid=1000,gid=1000 --tmpfs $T/libexec:mode=0755,uid=1000,gid=1000 \
            --tmpfs $T/tmp:mode=0777 \
            -v "$PWD/sim:$FINAL" --entrypoint /system/bin/sh "$IMAGE" "$FINAL/smoke.sh"
          test "$(grep -c SMOKE_OK build/logs/smoke.log)" = 2
          test "$(grep -c TERMINAL_OK build/logs/smoke.log)" = 2
          test "$(grep -c ANDROID_IMPORT_OK build/logs/smoke.log)" = 2
          test "$(grep -c ANDROID_IMPORT_IMAGE_OK build/logs/smoke.log)" = 2
          test "$(grep -c ANDROID_RUNTIME_FIXES_OK build/logs/smoke.log)" = 2
          test "$(grep -c ANDROID_RUNTIME_CAPABILITIES_OK build/logs/smoke.log)" = 2
          echo "::notice title=smoke output::$(tail -n 70 build/logs/smoke.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
