name: Publish verified APK

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Build APK run on main
        required: true
        type: string
      tag:
        description: Release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.run_id }}
      TAG: ${{ inputs.tag }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Verify build provenance and publish
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ && "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          run=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID")
          sha=$(jq -er --arg repo "$GH_REPO" 'select(.path == ".github/workflows/build-apk.yml" and .head_branch == "main" and .conclusion == "success" and .head_repository.full_name == $repo) | .head_sha' <<< "$run")
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          gh run download "$RUN_ID" --name apk --dir dist
          gh run download "$RUN_ID" --name payload --dir payload-artifact
          cd dist
          [[ -f artifact-manifest.json ]]
          python3 - "$GH_REPO" "$RUN_ID" "$sha" <<'PY'
          import json
          import sys

          repository, run_id, head_sha = sys.argv[1:]
          with open("artifact-manifest.json", encoding="utf-8") as stream:
              manifest = json.load(stream)
          build = manifest.get("build", {})
          checks = {
              "artifact_kind": manifest.get("artifact_kind") == "android-build-artifact",
              "repository": build.get("repository") == repository,
              "workflow": build.get("workflow") == "Build APK",
              "artifact_name": build.get("artifact_name") == "apk",
              "run_id": build.get("run_id") == run_id,
              "head_sha": build.get("head_sha") == head_sha,
          }
          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              raise SystemExit("artifact-manifest identity mismatch: " + ", ".join(failed))
          PY
          shopt -s nullglob
          apks=(hermes-*.apk)
          [[ ${#apks[@]} == 1 ]]
          apk=${apks[0]}
          manifest_apk=$(python3 -c 'import json; print(json.load(open("artifact-manifest.json", encoding="utf-8"))["apk"]["filename"])')
          [[ "$manifest_apk" == "$apk" ]]
          sha256sum --check --strict "$apk.sha256"
          manifest_digest=$(sha256sum artifact-manifest.json | awk '{print $1}')
          expected=$(gh api "repos/$GH_REPO/contents/android/release-cert.sha256?ref=$sha" --jq .content | base64 -d | tr -d '\r\n')
          [[ "$expected" =~ ^[0-9a-f]{64}$ && $(tr -d '\r\n' < release-cert.sha256) == "$expected" ]]
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          signer=$("$apksigner" verify --print-certs "$apk" | awk '/certificate SHA-256 digest:/ {print tolower($NF)}' | sort -u)
          [[ "$signer" == "$expected" ]]
          aapt=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          python3 ../scripts/verify_android_artifact_manifest.py \
            --manifest artifact-manifest.json \
            --apk "$apk" \
            --payload-manifest payload.json \
            --payload-artifact-manifest ../payload-artifact/payload.json \
            --payload-zip ../payload-artifact/payload.zip \
            --runtime-meta runtime-meta.json \
            --install-stamp install-stamp.json \
            --webui-revision-file webui-revision.txt \
            --release-cert-file release-cert.sha256 \
            --aapt "$aapt" \
            --signer-sha256 "$signer" \
            --repository "$GH_REPO" \
            --workflow "Build APK" \
            --artifact-name apk \
            --run-id "$RUN_ID" \
            --head-sha "$sha"
          mv "$apk" Hermes-Android.apk
          sha256sum Hermes-Android.apk > Hermes-Android.apk.sha256
          if gh release view "$TAG" --json isDraft >/dev/null 2>&1; then
            [[ $(gh release view "$TAG" --json isDraft --jq .isDraft) == true ]]
            gh release edit "$TAG" --target "$sha"
          else
            gh release create "$TAG" --draft --target "$sha" --title "Hermes Android $TAG" --notes '独立社区 Android 移植版。APK 使用项目长期签名。'
          fi
          digest=$(cut -d ' ' -f1 Hermes-Android.apk.sha256)
          existing=$(gh release view "$TAG" --json assets --jq '.assets[] | select(.name=="Hermes-Android.apk") | .digest')
          manifest_existing=$(gh release view "$TAG" --json assets --jq '.assets[] | select(.name=="artifact-manifest.json") | .digest')
          if [[ "$existing" != "sha256:$digest" || "$manifest_existing" != "sha256:$manifest_digest" ]]; then
            gh release upload "$TAG" Hermes-Android.apk Hermes-Android.apk.sha256 release-cert.sha256 artifact-manifest.json --clobber
          fi
          [[ $(gh release view "$TAG" --json assets --jq '.assets[] | select(.name=="Hermes-Android.apk" and .state=="uploaded") | .digest') == "sha256:$digest" ]]
          [[ $(gh release view "$TAG" --json assets --jq '.assets[] | select(.name=="artifact-manifest.json" and .state=="uploaded") | .digest') == "sha256:$manifest_digest" ]]
          gh api "repos/$GH_REPO/contents/RELEASE_NOTES.md?ref=$sha" --jq .content | base64 -d > release-notes.md
          test -s release-notes.md
          gh release edit "$TAG" --draft=false --latest --notes-file release-notes.md
