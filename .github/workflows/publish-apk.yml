name: Publish verified APK

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Build APK run on main
        required: true
        type: string
      tag:
        description: Release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.run_id }}
      TAG: ${{ inputs.tag }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify build provenance and publish
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ && "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          run=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID")
          sha=$(jq -er --arg repo "$GH_REPO" 'select(.path == ".github/workflows/build-apk.yml" and .head_branch == "main" and .conclusion == "success" and .head_repository.full_name == $repo) | .head_sha' <<< "$run")
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          gh run download "$RUN_ID" --name apk --dir dist
          cd dist
          shopt -s nullglob
          apks=(hermes-*.apk)
          [[ ${#apks[@]} == 1 ]]
          apk=${apks[0]}
          sha256sum --check --strict "$apk.sha256"
          expected=$(gh api "repos/$GH_REPO/contents/android/release-cert.sha256?ref=$sha" --jq .content | base64 -d | tr -d '\r\n')
          [[ "$expected" =~ ^[0-9a-f]{64}$ && $(tr -d '\r\n' < release-cert.sha256) == "$expected" ]]
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          signer=$("$apksigner" verify --print-certs "$apk" | awk '/certificate SHA-256 digest:/ {print tolower($NF)}' | sort -u)
          [[ "$signer" == "$expected" ]]
          mv "$apk" Hermes-Android.apk
          sha256sum Hermes-Android.apk > Hermes-Android.apk.sha256
          if gh release view "$TAG" --json isDraft >/dev/null 2>&1; then
            [[ $(gh release view "$TAG" --json isDraft --jq .isDraft) == true ]]
            gh release edit "$TAG" --target "$sha"
          else
            gh release create "$TAG" --draft --target "$sha" --title "Hermes Android $TAG" --notes '独立社区 Android 移植版。APK 使用项目长期签名。'
          fi
          digest=$(cut -d ' ' -f1 Hermes-Android.apk.sha256)
          existing=$(gh release view "$TAG" --json assets --jq '.assets[] | select(.name=="Hermes-Android.apk") | .digest')
          if [[ "$existing" != "sha256:$digest" ]]; then
            gh release upload "$TAG" Hermes-Android.apk Hermes-Android.apk.sha256 release-cert.sha256 --clobber
          fi
          [[ $(gh release view "$TAG" --json assets --jq '.assets[] | select(.name=="Hermes-Android.apk" and .state=="uploaded") | .digest') == "sha256:$digest" ]]
          gh api "repos/$GH_REPO/contents/RELEASE_NOTES.md?ref=$sha" --jq .content | base64 -d > release-notes.md
          test -s release-notes.md
          gh release edit "$TAG" --draft=false --latest --notes-file release-notes.md
